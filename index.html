<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batcave OS — Alfred</title>
<style>
  @property --balai { syntax: "<angle>"; inherits: false; initial-value: 360deg; }
  :root {
    --nuit:#020611; --marine:#07122b; --bleu:#2f7bff; --azur:#3fa2ff; --glace:#a8d3ff; --blanc:#eef5ff;
    --alerte:#ff4f4f; --doux:#6f88b5; --ombre:#3a4f7a;
    --trait:rgba(72,140,255,.26); --trait2:rgba(72,140,255,.11);
    --hud:"Bahnschrift","Segoe UI",Arial,sans-serif; --mono:"Cascadia Mono","Consolas","Lucida Console",monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--nuit); color: var(--blanc); font-family: var(--hud); overflow: hidden; }
  body.fige *, body.fige *::before, body.fige *::after { animation: none !important; transition: none !important; }
  body:not(.anim):not(.fige) #intro, body:not(.anim):not(.fige) #sonar { visibility: hidden; }   /* rien ne s'affiche avant le top départ */
  #sonar { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  body.anim #sonar { animation: fondu 1.6s .2s ease both; }
  .voile { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(95vh 70vh at 50% 44%, rgba(47,123,255,.17), transparent 64%),
                radial-gradient(70vh 50vh at 0% 100%, rgba(47,123,255,.10), transparent 62%),
                radial-gradient(70vh 50vh at 100% 0%, rgba(47,123,255,.08), transparent 62%),
                radial-gradient(ellipse at center, transparent 52%, rgba(0,2,8,.78) 100%); }
  .trames { position: fixed; inset: 0; z-index: 9; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(168,211,255,.028) 0 1px, transparent 1px 3px); }
  @keyframes fondu { from { opacity: 0; } }
  @keyframes tourne { to { transform: rotate(360deg); } }
  @keyframes pouls { 50% { transform: scale(1.55); opacity: .55; } }
  .k { color: var(--doux); font: 500 1.25vh var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .vide { color: var(--doux); font-size: 1.9vh; line-height: 1.5; }

  /* ================= INTRO : amorçage ================= */
  #intro { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; pointer-events: none; }
  .allumage { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: linear-gradient(90deg, transparent, #fff 30%, #fff 70%, transparent); opacity: 0; }
  body.anim .allumage { animation: allumage 1.2s ease-out both; }
  @keyframes allumage { 0% { transform: scaleX(0); opacity: 1; } 40% { transform: scaleX(1); opacity: 1; } 100% { transform: scale(1, 90); opacity: 0; } }
  .scene { text-align: center; transform: translateY(-3vh); }
  .embZone { position: relative; width: 34vh; height: 34vh; margin: 0 auto; }
  .ping { position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--azur); opacity: 0; }
  body.anim .ping { animation: ping 2.8s ease-out infinite; }
  body.anim .ping.p2 { animation-delay: .9s; } body.anim .ping.p3 { animation-delay: 1.8s; }
  @keyframes ping { from { transform: scale(.4); opacity: .8; } to { transform: scale(2.1); opacity: 0; } }
  .orbite { position: absolute; inset: 0; border-radius: 50%; border: 1px dashed rgba(63,162,255,.5); animation: tourne 18s linear infinite; }
  .orbite.o2 { inset: 8%; border: 2px solid transparent; border-top-color: var(--glace); border-right-color: var(--azur); animation-duration: 3.4s; animation-direction: reverse; }
  .orbite.o3 { inset: -10%; border: 1px dotted rgba(168,211,255,.28); animation-duration: 46s; }
  #embleme { position: absolute; inset: 17%; width: 66%; height: 66%; filter: drop-shadow(0 0 3vh rgba(47,123,255,.9)); overflow: visible; }
  .hexTrait { fill: none; stroke: url(#gTrait); stroke-width: 6; stroke-linejoin: round; }
  .hexPlein { fill: url(#gPlein); }
  .hex94 { font: 700 84px var(--hud); fill: #fff; text-anchor: middle; }
  #embleme .hexTrait { stroke-dasharray: 640; }
  body.anim .embZone { animation: surgit 1s .2s cubic-bezier(.2,.8,.2,1) both; }
  body.anim #embleme .hexTrait { animation: trace 1.9s .45s cubic-bezier(.6,.1,.2,1) both; }
  body.anim #embleme .hexPlein { animation: fondu .7s 2s ease both; }
  body.anim #embleme .hex94 { animation: fondu .5s 2.35s ease both; }
  @keyframes surgit { from { opacity: 0; transform: scale(.55); } }
  @keyframes trace { from { stroke-dashoffset: 640; } }
  .titre { margin-top: 3.4vh; font-size: 6vh; font-weight: 700; letter-spacing: .5em; padding-left: .5em; min-height: 7.2vh; text-shadow: 0 0 3vh rgba(63,162,255,.8); }
  body.anim .titre { animation: titreIn 1.2s 1.45s ease both; }
  @keyframes titreIn { from { opacity: 0; letter-spacing: 1em; } }
  .sousT { margin-top: 1.2vh; color: var(--azur); font-size: 2vh; letter-spacing: .46em; padding-left: .46em; }
  .sousT i { display: inline-block; width: .9vh; height: 2vh; margin-left: .6vh; background: var(--glace); vertical-align: -.3vh; animation: clignote 1s steps(1) infinite; }
  body.anim .sousT { animation: fondu .8s 3s ease both; }
  @keyframes clignote { 50% { opacity: 0; } }
  .journal { position: absolute; left: 3vw; bottom: 5vh; width: 32vw; font: 500 1.35vh var(--mono); letter-spacing: .08em; color: var(--doux); display: grid; gap: .55vh; }
  .lg { display: flex; align-items: baseline; gap: .6vw; white-space: nowrap; }
  .lg::before { content: ">"; color: var(--azur); }
  .lg i { flex: 1; border-bottom: 1px dotted var(--ombre); transform: translateY(-.3vh); }
  .lg b { color: var(--glace); font-weight: 600; } .lg b.ko { color: #ff9a9a; }
  body.anim .lg { animation: taper .45s steps(28) both; animation-delay: calc(.7s + var(--i) * .46s); }
  @keyframes taper { from { clip-path: inset(0 100% 0 0); } }
  .amorce { position: absolute; right: 3vw; bottom: 5vh; width: 25vw; font: 500 1.3vh var(--mono); letter-spacing: .2em; color: var(--doux); display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 1vw; }
  .amorce div { height: .5vh; background: var(--trait2); }
  .amorce div i { display: block; height: 100%; background: linear-gradient(90deg, var(--bleu), var(--glace)); box-shadow: 0 0 1vh var(--azur); }
  body.anim .amorce div i { animation: remplit 4.3s .35s cubic-bezier(.4,0,.3,1) both; }
  @keyframes remplit { from { width: 0; } }
  .amorce b { color: var(--blanc); min-width: 3.4vw; text-align: right; }
  .version { position: absolute; top: 4vh; left: 3vw; right: 3vw; display: flex; justify-content: space-between; font: 500 1.25vh var(--mono); letter-spacing: .22em; color: var(--ombre); text-transform: uppercase; }
  #intro.fin > :not(.scene), #intro.fin .scene > :not(.embZone), #intro.fin .ping, #intro.fin .orbite { opacity: 0 !important; transition: opacity .35s ease; }

  /* ================= TABLEAU DE BORD ================= */
  #tableau { position: fixed; inset: 0; z-index: 2; padding: 3vh 2.6vw 2.4vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 1.6vh; visibility: hidden; }
  #tableau.visible { visibility: visible; }
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2vw; padding-bottom: 1.3vh; position: relative; border-bottom: 1px solid var(--trait); }
  header::before, header::after { content: ""; position: absolute; bottom: -1px; height: 2px; width: 16%; }
  header::before { left: 0; background: linear-gradient(90deg, var(--azur), transparent); }
  header::after { right: 0; background: linear-gradient(270deg, var(--azur), transparent); }
  .marque { display: flex; align-items: center; gap: 1.1vw; }
  .marque svg { width: 7.2vh; height: 7.2vh; overflow: visible; filter: drop-shadow(0 0 1.4vh rgba(47,123,255,.75)); }
  .marque b { display: block; font-size: 3.1vh; letter-spacing: .36em; font-weight: 700; }
  .marque span { display: block; margin-top: .3vh; color: var(--azur); font-size: 1.45vh; letter-spacing: .42em; }
  .voyants { display: flex; gap: 1.5vw; font: 500 1.3vh var(--mono); letter-spacing: .14em; color: var(--doux); }
  .voyants span { display: flex; align-items: center; gap: .45vw; }
  .voyants i { width: .9vh; height: .9vh; border-radius: 50%; background: var(--azur); box-shadow: 0 0 1vh var(--azur); }
  .voyants .ko { color: #ff9a9a; } .voyants .ko i { background: var(--alerte); box-shadow: 0 0 1vh var(--alerte); }
  .voyants .mi i { background: var(--ombre); box-shadow: none; }
  .quand { text-align: right; }
  .quand .date { font-size: 2.5vh; letter-spacing: .2em; text-transform: uppercase; font-weight: 600; }
  .quand .lieu { margin-top: .5vh; color: var(--doux); font: 500 1.3vh var(--mono); letter-spacing: .12em; text-transform: uppercase; }

  main { display: grid; grid-template-columns: 27fr 46fr 27fr; gap: 1.4vw; min-height: 0; }
  .col { display: flex; flex-direction: column; gap: 1.4vh; min-height: 0; min-width: 0; }
  .gauche .panel { --dx: -3vw; --dy: 0vh; } .droite .panel { --dx: 3vw; --dy: 0vh; } .centre .panel { --dx: 0vw; --dy: 3vh; }
  #meteo { flex: 1.06 1 0; } #agendaP { flex: .94 1 0; } #prios { flex: 1 1 0; display: flex; flex-direction: column; } #prieresP { flex: 1.42 1 0; } #lecteurP { flex: .72 1 0; }

  .panel { position: relative; min-height: 0; overflow: hidden; padding: 1.8vh 1.3vw 1.5vh;
    background: linear-gradient(165deg, rgba(10,25,60,.70), rgba(3,8,22,.86)); border: 1px solid var(--trait);
    box-shadow: inset 0 0 6vh rgba(47,123,255,.08), inset 0 1px 0 rgba(168,211,255,.12), 0 1.2vh 4vh rgba(0,0,0,.5); }
  .panel::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(var(--glace), var(--glace)) top left / 2.4vh 2px no-repeat, linear-gradient(var(--glace), var(--glace)) top left / 2px 2.4vh no-repeat,
                linear-gradient(var(--glace), var(--glace)) bottom right / 2.4vh 2px no-repeat, linear-gradient(var(--glace), var(--glace)) bottom right / 2px 2.4vh no-repeat; }
  .panel::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 45%; pointer-events: none; opacity: 0;
    background: linear-gradient(100deg, transparent, rgba(168,211,255,.16), transparent); }
  .panel h2 { display: flex; align-items: center; gap: .8vw; font-size: 1.55vh; font-weight: 600; letter-spacing: .32em; color: var(--glace); margin-bottom: 1.4vh; white-space: nowrap; }
  .panel h2 i { font: 600 1.2vh var(--mono); font-style: normal; letter-spacing: .05em; color: var(--nuit); background: var(--azur); padding: .3vh .5vw .3vh .4vw; clip-path: polygon(0 0, 100% 0, 100% 55%, 80% 100%, 0 100%); }
  .panel h2::after { content: ""; order: 2; flex: 1; height: 1px; background: linear-gradient(90deg, var(--trait), transparent); }
  .panel h2 em { order: 3; font: 500 1.2vh var(--mono); font-style: normal; color: var(--doux); letter-spacing: .1em; text-transform: uppercase; }

  /* --- assemblage (seulement en direct) --- */
  body.anim #tableau.visible header { animation: descend .7s cubic-bezier(.2,.8,.2,1) both; }
  body.anim #tableau.visible .panel { animation: deploie .85s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(.25s + var(--o, 0) * .13s); }
  body.anim #tableau.visible .panel::before { animation: coins .9s ease both; animation-delay: calc(.6s + var(--o, 0) * .13s); }
  body.anim #tableau.visible .panel::after { animation: reflet 1.2s ease both; animation-delay: calc(.55s + var(--o, 0) * .13s); }
  body.anim #tableau.visible .st { animation: monte .55s ease both; animation-delay: calc(.65s + var(--o, 0) * .13s + var(--i, 0) * .07s); }
  body.anim #tableau.visible #noyau { animation: noyauIn 1.15s .05s cubic-bezier(.2,.8,.2,1) both; }
  body.anim #tableau.visible #cadran { animation: balai 1.6s .3s cubic-bezier(.5,0,.2,1) both; }
  body.anim #tableau.visible .repere { animation: monte .6s 1.3s ease both; }
  body.anim #tableau.visible footer { animation: monte .7s .95s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes descend { from { opacity: 0; transform: translateY(-2.4vh); } }
  @keyframes deploie { from { opacity: 0; transform: translate(var(--dx, 0), var(--dy, 2.5vh)) scale(.97); filter: blur(8px) brightness(2.2); } }
  @keyframes coins { from { background-size: 0 2px, 2px 0, 0 2px, 2px 0; } }
  @keyframes reflet { from { transform: translateX(-130%) skewX(-18deg); opacity: 1; } to { transform: translateX(260%) skewX(-18deg); opacity: 1; } }
  @keyframes monte { from { opacity: 0; transform: translateY(1.6vh); } }
  @keyframes noyauIn { from { opacity: 0; transform: scale(.55) rotate(-28deg); filter: blur(10px); } }
  @keyframes balai { from { --balai: 0deg; } }

  /* --- météo --- */
  .mHaut { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 1vw; }
  .icone { width: 9.5vh; height: 9.5vh; color: var(--glace); filter: drop-shadow(0 0 1vh rgba(63,162,255,.85)); }
  .icone svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
  .icone .rayons { animation: tourne 18s linear infinite; }
  .icone .gouttes path { animation: goutte 1.1s linear infinite; } .icone .gouttes path:nth-child(2) { animation-delay: .35s; } .icone .gouttes path:nth-child(3) { animation-delay: .7s; }
  .icone .flocons circle { fill: currentColor; animation: goutte 2.2s linear infinite; } .icone .flocons circle:nth-child(2) { animation-delay: .7s; } .icone .flocons circle:nth-child(3) { animation-delay: 1.4s; }
  .icone .eclair { fill: #fff; stroke: none; animation: eclair 2.8s steps(1) infinite; }
  .icone .brume path { animation: derive 4s ease-in-out infinite alternate; } .icone .brume path:nth-child(even) { animation-direction: alternate-reverse; }
  @keyframes goutte { from { transform: translate(2px, -3px); opacity: 0; } 25% { opacity: 1; } to { transform: translate(-4px, 12px); opacity: 0; } }
  @keyframes eclair { 0% { opacity: .2; } 6% { opacity: 1; } 10% { opacity: .25; } 14% { opacity: 1; } 22% { opacity: .3; } 100% { opacity: .3; } }
  @keyframes derive { from { transform: translateX(-4px); } to { transform: translateX(5px); } }
  .temp { font-size: 8.6vh; font-weight: 700; line-height: .86; font-variant-numeric: tabular-nums; text-shadow: 0 0 3vh rgba(63,162,255,.6); white-space: nowrap; }
  .temp sup { font-size: .3em; color: var(--azur); vertical-align: top; margin-left: .12em; position: relative; top: .3em; }
  .ciel { margin-top: .9vh; font-size: 2.1vh; text-transform: capitalize; }
  .cielJ { margin-top: .2vh; font-size: 1.45vh; color: var(--doux); }
  .jauge { position: relative; width: 11.5vh; height: 11.5vh; }
  .jauge svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .jauge .jf { fill: none; stroke: var(--trait2); stroke-width: 8; }
  .jauge .jv { fill: none; stroke: var(--azur); stroke-width: 8; stroke-linecap: round; filter: drop-shadow(0 0 6px var(--azur)); transition: stroke-dashoffset 1.7s cubic-bezier(.2,.8,.2,1) .5s; }
  .jauge .jt { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .jauge .jt b { font-size: 3.1vh; font-variant-numeric: tabular-nums; } .jauge .jt > span { color: var(--doux); font: 500 1.15vh var(--mono); letter-spacing: .16em; text-transform: uppercase; }
  .plage { margin-top: 1.9vh; }
  .plage .lgd { display: flex; justify-content: space-between; font: 500 1.2vh var(--mono); letter-spacing: .12em; color: var(--doux); text-transform: uppercase; }
  .plage .rail { position: relative; height: .7vh; margin: .9vh .85vh .6vh; background: linear-gradient(90deg, #17408f, #3fa2ff 55%, #eef5ff); border-radius: 1vh; }
  .plage .rail i { position: absolute; top: 50%; width: 1.7vh; height: 1.7vh; margin: -.85vh 0 0 -.85vh; border-radius: 50%; background: var(--nuit); border: .35vh solid #fff; box-shadow: 0 0 1.2vh var(--azur); transition: left 1.5s cubic-bezier(.2,.8,.2,1) .6s; }
  .plage .bornes { display: flex; justify-content: space-between; font-size: 1.9vh; font-weight: 600; font-variant-numeric: tabular-nums; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 1vw; margin-top: 1.5vh; }
  .duo div { padding: .7vh .8vw; border-left: 2px solid var(--azur); background: linear-gradient(90deg, rgba(47,123,255,.14), transparent); }
  .duo b { display: block; font-size: 2.5vh; font-variant-numeric: tabular-nums; }

  /* --- agenda --- */
  #agenda { position: relative; display: grid; gap: 1.1vh; align-content: start; padding-left: 1.5vw; }
  #agenda::before { content: ""; position: absolute; left: .35vw; top: .6vh; bottom: .6vh; width: 1px; background: linear-gradient(var(--azur), var(--trait) 75%, transparent); }
  .ev { position: relative; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .9vw; padding: .75vh .7vw; background: rgba(47,123,255,.07); border: 1px solid transparent; }
  .ev::before { content: ""; position: absolute; left: calc(-1.15vw - .5vh); top: 50%; width: 1vh; height: 1vh; margin-top: -.5vh; border-radius: 50%; background: var(--nuit); border: 2px solid var(--azur); }
  .ev .eh { font: 600 2vh var(--hud); font-variant-numeric: tabular-nums; color: var(--glace); min-width: 3.5vw; }
  .ev .eh small { display: block; font-size: 1.3vh; color: var(--doux); font-weight: 500; }
  .ev .et { font-size: 2vh; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ev .es { font: 500 1.05vh var(--mono); letter-spacing: .14em; color: var(--doux); border: 1px solid var(--trait); padding: .3vh .4vw; white-space: nowrap; }
  .ev.passe { opacity: .45; }
  .ev.cours { border-color: var(--azur); background: linear-gradient(90deg, rgba(63,162,255,.24), rgba(63,162,255,.04)); box-shadow: 0 0 2vh rgba(47,123,255,.3); }
  .ev.cours .es { color: var(--nuit); background: var(--glace); border-color: var(--glace); }
  .ev.cours::before { background: #fff; border-color: #fff; box-shadow: 0 0 1.2vh #fff; }
  .ev.suiv .es { color: var(--glace); border-color: var(--azur); }

  /* --- noyau : cadran du jour --- */
  #noyauZone { flex: 0 0 44vh; position: relative; display: grid; place-items: center; min-height: 0; }
  #noyau { position: relative; height: 100%; aspect-ratio: 1; }
  #barres { position: absolute; inset: 0; width: 100%; height: 100%; }
  #cadran { position: absolute; top: 0; left: -12.5%; width: 125%; height: 100%; overflow: visible;
    -webkit-mask-image: conic-gradient(from 180deg, #000 var(--balai), transparent var(--balai)); mask-image: conic-gradient(from 180deg, #000 var(--balai), transparent var(--balai)); }
  #cadran .orb { fill: none; stroke: var(--trait); }
  #cadran .grad { fill: none; stroke: rgba(111,136,181,.6); } #cadran .grad6 { fill: none; stroke: var(--glace); stroke-width: 2; }
  #cadran .hh { fill: var(--doux); font: 500 12.5px var(--mono); text-anchor: middle; dominant-baseline: central; } #cadran .hh.fort { fill: var(--glace); }
  #cadran .jour { fill: none; stroke: url(#gJour); stroke-width: 4; stroke-linecap: round; }
  #cadran .jourLueur { fill: none; stroke: var(--azur); stroke-width: 11; opacity: .5; filter: url(#lueur); }
  #cadran .creneau { fill: none; stroke: rgba(63,162,255,.34); stroke-width: 10; }
  #cadran .creneau.court { stroke: var(--azur); stroke-width: 2; }
  #cadran .creneau.passe { stroke: rgba(63,162,255,.14); }
  #cadran .creneau.cours { stroke: rgba(200,228,255,.9); filter: drop-shadow(0 0 6px var(--azur)); }
  #cadran .pr line { stroke: var(--azur); stroke-width: 2; }
  #cadran .pr .pt { fill: var(--nuit); stroke: var(--azur); stroke-width: 2; transform-box: fill-box; transform-origin: center; }
  #cadran .pr text { fill: var(--glace); font: 600 14.5px var(--hud); letter-spacing: 2px; dominant-baseline: central; }
  #cadran .pr.passe { opacity: .42; }
  #cadran .pr.suiv line { stroke: #fff; } #cadran .pr.suiv text { fill: #fff; }
  #cadran .pr.suiv .pt { fill: #fff; stroke: #fff; animation: pouls 1.8s ease-in-out infinite; }
  #cadran .tourne { transform-origin: 320px 320px; animation: tourne 150s linear infinite; }
  #cadran .tourne.inverse { animation-duration: 34s; animation-direction: reverse; }
  #cadran .pointille { fill: none; stroke: rgba(63,162,255,.45); stroke-dasharray: 2 9; }
  #cadran .arcs3 { fill: none; stroke: var(--azur); stroke-width: 1.5; stroke-dasharray: 150 145.3; opacity: .7; }
  #cadran .fin { fill: none; stroke: var(--trait); } #cadran .sec60 { fill: none; stroke: rgba(168,211,255,.5); stroke-width: 3; stroke-dasharray: 1.5 15.046; }
  #cadran .arcSec { fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 955.04; filter: drop-shadow(0 0 4px var(--azur)); }
  #aiguille { transform-origin: 320px 320px; }
  #aiguille line { stroke: var(--alerte); stroke-width: 2; } #aiguille path { fill: var(--alerte); }
  #aiguille circle { fill: #fff; stroke: var(--alerte); stroke-width: 2; filter: drop-shadow(0 0 5px var(--alerte)); }
  .coeur { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -52%); width: 46%; text-align: center; pointer-events: none; }
  .coeur .lbl { display: block; font: 500 1.1vh var(--mono); letter-spacing: .3em; color: var(--doux); }
  .coeur b { display: block; margin-top: .5vh; font-size: 7.8vh; font-weight: 700; line-height: 1; font-stretch: 88%; font-variant-numeric: tabular-nums; text-shadow: 0 0 3vh rgba(63,162,255,.8); }
  .coeur .sec { display: block; margin-top: .4vh; min-height: 2.2vh; font: 600 1.9vh var(--mono); color: var(--azur); letter-spacing: .2em; }
  .repere { position: absolute; width: 27%; }
  .repere span { display: block; font: 500 1.15vh var(--mono); letter-spacing: .14em; color: var(--doux); text-transform: uppercase; }
  .repere b { margin-top: .3vh; font-size: 2.2vh; font-weight: 600; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .repere small { display: block; margin-top: .2vh; font-size: 1.4vh; color: var(--glace); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .repere::before { content: ""; display: block; width: 3vw; height: 2px; margin-bottom: .8vh; background: var(--azur); box-shadow: 0 0 1vh var(--azur); }
  .r1 { left: 0; top: .6vh; } .r3 { left: 0; bottom: .6vh; }
  .r2 { right: 0; top: .6vh; text-align: right; } .r4 { right: 0; bottom: .6vh; text-align: right; }
  .r2::before, .r4::before { margin-left: auto; }

  /* --- priorités --- */
  .prios { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: .9vh 1vw; }
  .prios.seul { grid-template-columns: 1fr; }
  .pr { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: .9vw; padding: .6vh .8vw; min-height: 0; border-left: 2px solid var(--azur); background: linear-gradient(90deg, rgba(47,123,255,.14), rgba(47,123,255,.02)); }
  .pr b { display: grid; place-items: center; width: 4.3vh; height: 4.3vh; font: 700 1.6vh var(--mono); color: var(--blanc); background: rgba(63,162,255,.24); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
  .pr span { font-size: 2.05vh; line-height: 1.22; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* --- prières --- */
  .pLigne { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 1.2vw; padding: .36vh .5vw; border-bottom: 1px solid var(--trait2); }
  .pLigne .pn { font-size: 2.05vh; letter-spacing: .05em; }
  .pLigne .ph { text-align: right; min-width: 4.2vw; }
  .pLigne .ph b { display: block; font-size: 2.2vh; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .pLigne .ph small { font: 500 1.05vh var(--mono); letter-spacing: .16em; color: var(--doux); text-transform: uppercase; }
  .pLigne.lever .pn, .pLigne.lever b { color: var(--doux); font-weight: 500; }
  .pLigne.passe { opacity: .42; }
  .pLigne.suiv { background: linear-gradient(90deg, rgba(63,162,255,.26), rgba(63,162,255,.03)); border-bottom-color: var(--azur); box-shadow: inset 2px 0 0 #fff; }
  .pLigne.suiv .pn, .pLigne.suiv b { color: #fff; text-shadow: 0 0 1.2vh rgba(63,162,255,.95); }
  .compte { margin-top: .8vh; padding: .6vh .8vw .5vh; border: 1px solid var(--trait); background: rgba(47,123,255,.08); }
  .compte .cH { display: flex; justify-content: space-between; align-items: baseline; gap: 1vw; }
  .compte .cH b { font-size: 2.4vh; letter-spacing: .06em; white-space: nowrap; }
  .compte .cT { margin-top: .1vh; font-size: 1.6vh; color: var(--glace); text-align: right; }
  .rail2 { height: .5vh; margin: .5vh 0 .4vh; background: var(--trait2); overflow: hidden; }
  .rail2 i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--bleu), var(--glace)); box-shadow: 0 0 1vh var(--azur); transition: width 1.3s ease; }
  .compte .cB { display: flex; justify-content: space-between; font: 500 1.1vh var(--mono); letter-spacing: .1em; color: var(--doux); text-transform: uppercase; }

  /* --- lecteur --- */
  .lecteur { display: grid; grid-template-columns: auto 1fr; gap: 1.1vw; align-items: center; cursor: pointer; }
  .cadreP { position: relative; width: 15vh; height: 15vh; border: 1px solid var(--azur); box-shadow: 0 0 2.4vh rgba(47,123,255,.5); background: linear-gradient(135deg, #0c1d45, #040b1e); overflow: hidden; will-change: transform; }
  .cadreP img { position: relative; width: 100%; height: 100%; object-fit: cover; display: block; }
  .cadreP svg { position: absolute; inset: 22%; width: 56%; height: 56%; fill: none; stroke: var(--azur); stroke-width: 3; opacity: .7; }
  .cadreP::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(2,6,17,.5)), repeating-linear-gradient(0deg, rgba(255,255,255,.045) 0 1px, transparent 1px 3px); }
  .pInfos { min-width: 0; }
  .pInfos .tt { margin-top: .4vh; font-size: 2.15vh; font-weight: 700; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pInfos .ar { display: block; margin-top: .2vh; font-size: 1.7vh; color: var(--glace); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eq { display: flex; align-items: flex-end; gap: .2vw; height: 3.2vh; margin-top: .9vh; }
  .eq i { flex: 1; height: 100%; transform-origin: bottom; transform: scaleY(.06); background: linear-gradient(var(--glace), var(--bleu)); }
  .rail3 { height: .35vh; margin-top: .8vh; background: var(--trait2); } .rail3 i { display: block; height: 100%; width: 0; background: var(--glace); box-shadow: 0 0 .8vh var(--azur); }
  .tps { display: flex; justify-content: space-between; margin-top: .4vh; font: 500 1.1vh var(--mono); color: var(--doux); letter-spacing: .1em; }
  .suite { margin-top: .9vh; font: 500 1.1vh var(--mono); letter-spacing: .1em; color: var(--doux); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* --- pied : Alfred, sous-titres --- */
  footer { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 2vw; padding-top: 1.3vh; border-top: 1px solid var(--trait); min-height: 8.8vh; }
  .alfred { display: flex; align-items: center; gap: 1vw; min-width: 11vw; }
  .orbe { position: relative; width: 4.4vh; height: 4.4vh; border-radius: 50%; border: 1px solid var(--azur); display: grid; place-items: center; }
  .orbe i { width: 1.5vh; height: 1.5vh; border-radius: 50%; background: var(--glace); box-shadow: 0 0 1.6vh var(--azur); }
  .orbe::before { content: ""; position: absolute; inset: -.6vh; border-radius: 50%; border: 1px solid var(--trait); border-top-color: var(--glace); animation: tourne 3.2s linear infinite; }
  body.parle .orbe i { background: #fff; animation: pouls .7s ease-in-out infinite; }
  .alfred b { display: block; font-size: 1.8vh; letter-spacing: .34em; }
  .alfred span { font: 500 1.1vh var(--mono); letter-spacing: .16em; color: var(--doux); }
  body.parle .alfred span { color: var(--glace); }
  .sous { min-height: 7.4vh; display: grid; place-items: center; text-align: center; font-size: 2.75vh; line-height: 1.32; }
  .sous .cue { animation: monte .3s ease both; }
  .sous .w { color: rgba(168,211,255,.36); transition: color .12s; }
  .sous .w.dit { color: var(--blanc); }
  .sous .w.vif { color: #fff; text-shadow: 0 0 1.4vh rgba(63,162,255,.95); }
  .sous.repos { font-size: 2vh; color: var(--doux); letter-spacing: .1em; }
  button { background: rgba(47,123,255,.14); color: var(--blanc); border: 1px solid var(--azur); padding: 1.2vh 1.7vw; font: 600 1.6vh var(--hud); letter-spacing: .26em; cursor: pointer;
    clip-path: polygon(0 0, calc(100% - 1.2vh) 0, 100% 1.2vh, 100% 100%, 1.2vh 100%, 0 calc(100% - 1.2vh)); transition: background .2s, color .2s; }
  button:hover { background: var(--azur); color: var(--nuit); }

  @media (max-aspect-ratio: 1/1) {
    html, body { overflow: auto; }
    #tableau { position: relative; min-height: 100%; }
    header, main, footer { grid-template-columns: 1fr; }
    .quand { text-align: left; } .voyants { flex-wrap: wrap; }
    .panel { flex: none !important; } .repere { display: none; }
  }
</style>
</head>

<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script>
let D = null;
const q = new URLSearchParams(location.search);
const FIGE = null; let JOUER = false;
// Essais sans aucun son : ?sim=12 fige la voix à 12 s (sous-titres, anneau), ?simfond=40 fige la musique à 40 s (égaliseur).
const SIM = null, SIMF = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const deux = (n) => String(n).padStart(2, "0");
const enMin = (s) => { const m = /^(\d{1,2})\s*(?::|h)\s*(\d{2})$/.exec(String(s || "").trim()); return m ? +m[1] * 60 + +m[2] : null; };
const hhmm = (mn) => deux(Math.floor(mn / 60) % 24) + ":" + deux(mn % 60);
const mmss = (t) => Math.floor(t / 60) + ":" + deux(Math.floor(t % 60));
const duree = (sec) => { const m = Math.max(1, Math.ceil(sec / 60)), h = Math.floor(m / 60); return h ? h + " h " + deux(m % 60) : m + " min"; };
const INTRO_MS = 5000, VOIX_MS = 6000, EQN = 26;
let T0 = performance.now();
let VM = 0.6, VB = 0.14;
let FONDS = [];
let FOND_VOL = 0.5, FOND_BAS = 0.1;
let DELAI_FOND = 10;
let assemble = false, fondIdx = 0, fondLance = false;

function maintenant() {
  if (FIGE === "tableau" && D) { const [j, h] = D.genere.split(" "); return new Date(j + "T" + h + ":00"); }
  return new Date();
}
function niveau(nv, cle, t) {   // niveau sonore mesuré (0-99) à l'instant t
  if (!nv || t < 0) return 0;
  const a = nv[cle], x = t / nv.pas, i = Math.floor(x);
  return i >= a.length - 1 ? 0 : a[i] + (a[i + 1] - a[i]) * (x - i);
}

/* ================= contenu ================= */
function icone(type, nuit) {
  const nuage = (dy) => `<path transform="translate(0 ${dy})" d="M30 66H70a15 15 0 0 0 2-29.8 21 21 0 0 0-40.5-5.2A17.5 17.5 0 0 0 30 66z"/>`;
  const soleil = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}"/><g class="rayons" style="transform-origin:${x}px ${y}px">` + Array.from({ length: 8 }, (_, i) => {
    const a = i * Math.PI / 4, c = Math.cos(a), s = Math.sin(a);
    return `<path d="M${(x + c * (r + 7)).toFixed(1)} ${(y + s * (r + 7)).toFixed(1)}L${(x + c * (r + 14)).toFixed(1)} ${(y + s * (r + 14)).toFixed(1)}"/>`; }).join("") + "</g>";
  const lune = (dx, dy, k) => `<path transform="translate(${dx} ${dy}) scale(${k})" d="M62 22a30 30 0 1 0 16 44A24 24 0 0 1 62 22z"/>`;
  const gouttes = '<g class="gouttes"><path d="M38 66l-4 11"/><path d="M52 66l-4 11"/><path d="M66 66l-4 11"/></g>';
  switch (type) {
    case "eclaircie": return (nuit ? lune(36, -8, .5) : soleil(70, 28, 9)) + nuage(8);
    case "nuage": return nuage(0);
    case "brume": return '<g class="brume"><path d="M22 38H78"/><path d="M30 50H86"/><path d="M18 62H70"/><path d="M30 74H80"/></g>';
    case "pluie": return nuage(-10) + gouttes;
    case "neige": return nuage(-10) + '<g class="flocons"><circle cx="36" cy="68" r="1.8"/><circle cx="50" cy="72" r="1.8"/><circle cx="64" cy="68" r="1.8"/></g>';
    case "orage": return nuage(-10) + '<path class="eclair" d="M54 60l-11 15h9l-4 13 14-18h-9l5-10z"/><g class="gouttes"><path d="M32 66l-3 9"/><path d="M73 66l-3 9"/></g>';
    default: return nuit ? lune(0, 0, 1) : soleil(50, 50, 15);
  }
}
function typeCiel(t) {
  t = (t || "").toLowerCase();
  return /orage/.test(t) ? "orage" : /neige/.test(t) ? "neige" : /pluie|averse|bruine/.test(t) ? "pluie" : /brouillard/.test(t) ? "brume" : /couvert/.test(t) ? "nuage" : /nuageux/.test(t) ? "eclaircie" : "clair";
}

function remplirMeteo(m) {
  if (!m) { $("meteo_c").innerHTML = '<div class="vide">Service météo injoignable au moment de la préparation.<br>Alfred n\'invente pas de prévision.</div>'; $("meteoSrc").textContent = "hors ligne"; return; }
  const n = maintenant(), mn = n.getHours() * 60 + n.getMinutes(), nuit = mn < enMin(m.lever) || mn > enMin(m.coucher);
  const C = 2 * Math.PI * 50, fin = (C * (1 - m.pluie / 100)).toFixed(1);
  const pos = (m.max > m.min ? Math.max(0, Math.min(1, (m.temp - m.min) / (m.max - m.min))) * 100 : 50).toFixed(1) + "%";
  $("meteoSrc").textContent = m.source + " · relevé " + m.releve.slice(-5);
  $("meteo_c").innerHTML = `
    <div class="mHaut st" style="--i:0">
      <div class="icone"><svg viewBox="0 0 100 100">${icone(typeCiel(m.ciel), nuit)}</svg></div>
      <div><div class="temp"><span id="tNum" data-v="${m.temp}">${m.temp}</span><sup>°C</sup></div><div class="ciel">${esc(m.ciel)}</div><div class="cielJ">Aujourd'hui : ${esc(m.ciel_jour)}</div></div>
      <div class="jauge"><svg viewBox="0 0 120 120"><circle class="jf" cx="60" cy="60" r="50"/><circle class="jv" id="anneauPluie" cx="60" cy="60" r="50" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${fin}" data-c="${C.toFixed(1)}" data-fin="${fin}"/></svg>
        <div class="jt"><b><span id="pNum" data-v="${m.pluie}">${m.pluie}</span>%</b><span>pluie</span></div></div>
    </div>
    <div class="plage st" style="--i:1"><div class="lgd"><span>min</span><span>température du jour</span><span>max</span></div>
      <div class="rail"><i id="curseurT" style="left:${pos}" data-fin="${pos}"></i></div>
      <div class="bornes"><span>${m.min}°</span><span>${m.max}°</span></div></div>
    <div class="duo st" style="--i:2"><div><b>${m.ressenti}°</b><span class="k">ressenti</span></div><div><b>${m.vent} km/h</b><span class="k">vent</span></div></div>`;
}

function remplirPriorites() {
  const L = D.priorites || [];
  $("nbPrio").textContent = L.length + " / 5";
  $("prio").className = "prios" + (L.length <= 2 ? " seul" : "");
  $("prio").innerHTML = L.length ? L.map((p, i) => `<div class="pr st" style="--i:${i}"><b>${deux(i + 1)}</b><span>${esc(p)}</span></div>`).join("")
                                 : '<div class="vide">Aucune priorité dans priorites.md.</div>';
}

function remplirPrieres(P) {
  if (!P) { $("prieres").innerHTML = '<div class="vide">Horaires indisponibles (mosquée injoignable et pas de cache).</div>'; $("mosq").textContent = "hors ligne"; return; }
  $("mosq").textContent = P.jumua && P.jumua.length ? "Jumu'a " + P.jumua.join(" · ") : "Choisy-le-Roi";
  $("prieres").innerHTML = P.prieres.map((p, i) => {
    const lever = p.nom === "Shuruq";
    return `<div class="pLigne st${lever ? " lever" : ""}" style="--i:${i}" data-nom="${esc(p.nom)}" data-t="${enMin(p.adhan)}"><span class="pn">${lever ? "Lever du soleil" : esc(p.nom)}</span>
      <span class="ph"><b>${p.adhan}</b><small>${lever ? "&nbsp;" : "adhan"}</small></span><span class="ph">${p.iqama ? `<b>${p.iqama}</b><small>iqama</small>` : ""}</span></div>`; }).join("") +
    `<div class="compte st" style="--i:6"><div class="cH"><span class="k">prochaine prière</span><b id="pNom"></b></div><div class="cT" id="pDans"></div>
      <div class="rail2"><i id="pProg"></i></div><div class="cB"><span id="pDe"></span><span id="pA"></span></div></div>`;
}

function remplirAgenda() {
  const A = D.agenda;
  if (A === null) { $("agenda").innerHTML = '<div class="vide">Ni agenda Google connecté, ni semaine type renseignée.<br>Remplis emploi_du_temps.json ou ajoute « agenda_ics » dans config.json.</div>'; $("nbAg").textContent = "hors ligne"; return; }
  if (!A.length) { $("agenda").innerHTML = '<div class="vide">Rien de prévu aujourd\'hui.</div>'; $("nbAg").textContent = "journée libre"; return; }
  $("nbAg").textContent = A.length + " créneau" + (A.length > 1 ? "x" : "");
  const MAX = 4;
  $("agenda").innerHTML = A.slice(0, MAX).map((e, i) => {
    const d = enMin(e.heure), f = enMin(e.fin);
    const titre = f != null ? e.titre.replace(/\s*\(\s*\d{1,2}\s*h\s*\d{0,2}\s*[-–]\s*\d{1,2}\s*h\s*\d{0,2}\s*\)\s*$/i, "") : e.titre;

  const m = $("musique"), de = m.volume, t0 = performance.now();

  rampeId = setInterval(() => { const u = Math.min((performance.now() - t0) / ms, 1); m.volume = Math.max(0, Math.min(1, de + (vers - de) * u)); if (u >= 1) { clearInterval(rampeId); if (fin) fin(); } }, 40);
}
function musique(volume) {
  const m = $("musique");
  if (!D || !D.musique) return;
  if (m.paused) { m.currentTime = 0; m.volume = volume; m.play().then(() => { document.body.dataset.musique = "oui"; }).catch(() => {}); }
  else rampe(volume, 900);
}
function finMusique() { rampe(VM, 1500, () => setTimeout(() => rampe(0, 6000, () => $("musique").pause()), 9000)); }
let fondRampeId = null;
function fondRampe(vers, ms) {
  const a = $("fond"), de = a.volume, t0 = performance.now();
  clearInterval(fondRampeId);
  fondRampeId = setInterval(() => { const u = Math.min((performance.now() - t0) / ms, 1); a.volume = Math.max(0, Math.min(1, de + (vers - de) * u)); if (u >= 1) clearInterval(fondRampeId); }, 40);
}
function jouerFond(i) {
  if (!FONDS.length) return;
  const premier = !fondLance; fondIdx = (i + FONDS.length) % FONDS.length; fondLance = true;
  const p = FONDS[fondIdx], a = $("fond");
  clearInterval(fondRampeId);
  a.src = p.audio; a.volume = voixEnCours() ? FOND_BAS : FOND_VOL;   // sous la voix : la musique arrive déjà baissée
  a.play().catch(() => {});
  afficherPiste(fondIdx);
  a.onended = () => jouerFond(fondIdx + 1);
  if (premier && !$("musique").paused) rampe(0, 2600, () => $("musique").pause());   // ta musique prend le relais du thème d'Alfred
}
// La voix ne démarre qu'une fois le fichier audio entièrement chargé (pas pendant son chargement).
function pretVoix(cb) {
  const a = $("voix");
  if (a.readyState >= 4) return cb();
  a.addEventListener("canplaythrough", () => cb(), { once: true });
  a.load();
}
function parler() {
  const a = $("voix");
  a.currentTime = 0;
  if (!fondLance) { if ($("musique").paused) musique(VB); else rampe(VB, 1100); }
  if (fondLance) fondRampe(FOND_BAS, 1100);
  a.play().then(() => {
    document.body.classList.add("parle"); $("alfredEtat").textContent = "PARLE"; cueIdx = -1;
    document.title = "Batcave OS — Alfred (voix en cours" + (document.body.dataset.musique ? " + musique)" : ")");
  }).catch(() => { $("ecouter").textContent = "CLIQUER POUR ÉCOUTER"; document.title = "Batcave OS — Alfred (cliquer pour écouter)"; });
  a.onended = () => {
    document.body.classList.remove("parle"); $("alfredEtat").textContent = "BRIEFING TERMINÉ"; document.title = "Batcave OS — Alfred";
    if (fondLance) fondRampe(FOND_VOL, 1800); else finMusique();
    repos("« " + D.devise + " »");
  };
}

/* ================= cinématique ================= */
function introVive() {
  const el = $("introTitre"), fin = "BATCAVE OS", G = "ABCDEFGHKLMNPRSTVXZ0123456789", t0 = performance.now() + 1500;
  (function pas() {
    const u = (performance.now() - t0) / 1100;
    if (u >= 1) { el.textContent = fin; return; }
    if (u < 0) el.textContent = " ";
    else { const n = Math.floor(u * fin.length); el.textContent = fin.slice(0, n) + [...fin.slice(n)].map((c) => c === " " ? " " : G[Math.floor(Math.random() * G.length)]).join(""); }
    requestAnimationFrame(pas);
  })();
  (function pct() { const u = Math.min(1, (performance.now() - T0 - 350) / 4300), e = u < 0 ? 0 : 1 - Math.pow(1 - u, 1.6); $("pctA").textContent = Math.round(e * 100) + " %"; if (u < 1) requestAnimationFrame(pct); })();
  [700, 2300, 3900].forEach((t) => setTimeout(() => onde({ a: .6 }), t));
}
function compter(el, ms) {
  if (!el) return; const v = +el.dataset.v, t0 = performance.now(); el.textContent = "0";
  (function pas() { const u = Math.min(1, (performance.now() - t0) / ms); el.textContent = Math.round(v * (1 - Math.pow(1 - u, 3))); if (u < 1) requestAnimationFrame(pas); })();
}
function assembler() {
  const intro = $("intro"), emb = $("embleme"), logo = $("logo");
  const a = emb.getBoundingClientRect(), b = logo.getBoundingClientRect();   // mesuré avant que l'en-tête ne s'anime
  // jauges remises à zéro puis lancées : elles se remplissent pendant que les panneaux se déploient
  const an = $("anneauPluie"), cu = $("curseurT"), pp = $("pProg");
  [an, cu, pp].forEach((e) => { if (e) e.style.transition = "none"; });
  if (an) an.setAttribute("stroke-dashoffset", an.dataset.c); if (cu) cu.style.left = "0%"; const largeur = pp ? pp.style.width : ""; if (pp) pp.style.width = "0";
  void document.body.offsetWidth;
  [an, cu, pp].forEach((e) => { if (e) e.style.transition = ""; });
  assemble = true; $("tableau").classList.add("visible"); intro.classList.add("fin");
  logo.style.opacity = 0; emb.style.transformOrigin = "0 0"; emb.style.transition = "transform .95s cubic-bezier(.65,0,.2,1)";
  emb.style.transform = `translate(${(b.left - a.left).toFixed(1)}px, ${(b.top - a.top).toFixed(1)}px) scale(${(b.width / a.width).toFixed(4)})`;
  setTimeout(() => { logo.style.opacity = 1; intro.style.display = "none"; }, 1000);
  setTimeout(() => { if (an) an.setAttribute("stroke-dashoffset", an.dataset.fin); if (cu) cu.style.left = cu.dataset.fin; if (pp) pp.style.width = largeur; compter($("tNum"), 1500); compter($("pNum"), 1700); }, 450);
  onde({ r0: 0.215, a: .7 }); setTimeout(() => onde({ r0: 0.215, a: .5 }), 900);
}
let dernier = 0;
function boucle(ts) {
  const dt = Math.min(0.05, (ts - dernier) / 1000 || 0); dernier = ts;
  decor(dt); barres(ts); lecteurVif(ts);
  const tv = tempsVoix(); if (tv !== null) majSousTitres(tv);
  requestAnimationFrame(boucle);
}

function demarrer(p) {
  D = p; JOUER = true;
  VM = D.musique_volume != null ? D.musique_volume : 0.6; VB = D.musique_bas != null ? D.musique_bas : 0.14;
  FONDS = D.fond || []; FOND_VOL = D.fond_volume != null ? D.fond_volume : 0.5; FOND_BAS = D.fond_bas != null ? D.fond_bas : 0.1;
  DELAI_FOND = D.fond_delai != null ? D.fond_delai : 10;
  tailler(); remplir();
  document.body.classList.add("anim");
  T0 = performance.now();
  introVive(); setInterval(tic, 1000);
  setTimeout(assembler, INTRO_MS);
  requestAnimationFrame(boucle);
  addEventListener("resize", tailler);
  if (D.musique) musique(VM);
  setTimeout(() => pretVoix(parler), 2500);
  if (FONDS.length) setTimeout(() => { if (!fondLance) jouerFond(0); }, DELAI_FOND * 1000);
}
$("ecouter").style.display = "none";
const CAST_NS = "urn:x-cast:com.batcave.alfred";
const contexte = cast.framework.CastReceiverContext.getInstance();
contexte.addCustomMessageListener(CAST_NS, (ev) => { if (!D && ev.data) demarrer(ev.data); });
contexte.start();
